<!doctype html>
<html><head><meta charset="utf-8"><title>Product card</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>function scTheme() { if (location.hash === "#dark" || location.hash === "#light") document.documentElement.setAttribute("data-theme", location.hash.slice(1)); } scTheme(); addEventListener("hashchange", scTheme);</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>html,body{margin:0;height:100%}</style></head>
<body>
<div class="sc-stage">
  <article class="sc-card sc-product">
    <div class="sc-product__body">
      <div><h3 class="sc-card__title">Super Cub 50</h3><p class="sc-card__caption">Price (dollar/$) :</p></div>
      <span class="sc-price">1.403,04 $</span>
    </div>
    <div class="sc-product__thumb" aria-hidden="true">
      <svg viewBox="0 0 112 112"><rect class="sc-fill-orange" x="0" y="0" width="112" height="56"/><circle class="sc-fill-moss" cx="56" cy="64" r="30"/><circle class="sc-fill-surface" cx="56" cy="64" r="14"/></svg>
    </div>
  </article>
</div>
</body></html>
