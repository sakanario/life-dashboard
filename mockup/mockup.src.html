<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sidebar nav kiri + area kerja; di HP jadi header + nav geser horizontal.
   Skin: Super Cub design system — kartu kaca di atas langit teal yang di-blur, oranye buat aksi & data, navy buat media. */
:root{
  --bg:#8ec5c9; --surface:#ffffff; --ink:#2b2350; --muted:#55536b;
  --sunk:rgba(43,35,80,.07); --line:rgba(43,35,80,.12);
  --glass:rgba(255,255,255,.32); --glass-strong:rgba(255,255,255,.82); --field:rgba(255,255,255,.34); --primary-bg:rgba(247,144,10,.62); --primary-hover:rgba(247,144,10,.8); --primary-ink:#241d47; --bar-fill:rgba(247,144,10,.62); --bar-good:rgba(63,122,71,.55); --card-glass:rgba(255,255,255,.48);
  --accent:#f7900a; --accent-ink:#241d47; --accent-soft:rgba(247,144,10,.2); --accent-text:#a85600;
  --navy:#2f2858; --on-navy:#ffffff; --teal-mist:#c2e1e3; --moss:#4d6e52;
  --gold:#2f2858; --gold-soft:rgba(47,40,88,.12); --good:#3f7a47; --good-soft:rgba(63,122,71,.16); --warn:#a85600; --warn-soft:rgba(247,144,10,.18); --bad:#b3343f;
  --h0:rgba(43,35,80,.08); --h1:rgba(247,144,10,.24); --h2:rgba(247,144,10,.44); --h3:rgba(247,144,10,.68); --h4:rgba(184,95,0,.82);
  --wash:.28; --bg-filter:blur(24px) saturate(1.1);
  --f-display:"Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:22px; --r-sm:14px;
}
:root[data-theme="dark"]{
  --bg:#14303a; --surface:#26204a; --ink:#f3f1fa; --muted:#bdb9d3;
  --sunk:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --glass:rgba(38,32,74,.4); --glass-strong:rgba(38,32,74,.9); --field:rgba(255,255,255,.08); --primary-bg:rgba(255,157,31,.42); --primary-hover:rgba(255,157,31,.58); --primary-ink:#ffffff; --bar-fill:rgba(255,157,31,.55); --bar-good:rgba(127,200,138,.5); --card-glass:rgba(38,32,74,.5);
  --accent:#ff9d1f; --accent-ink:#241d47; --accent-soft:rgba(255,157,31,.2); --accent-text:#ffb04d;
  --navy:#4b4190; --on-navy:#ffffff; --teal-mist:#2b5660; --moss:#6f9a75;
  --gold:#b9b0ff; --gold-soft:rgba(185,176,255,.16); --good:#7fc88a; --good-soft:rgba(127,200,138,.16); --warn:#ffb04d; --warn-soft:rgba(255,157,31,.18); --bad:#ff8a93;
  --h0:rgba(255,255,255,.08); --h1:rgba(255,157,31,.2); --h2:rgba(255,157,31,.38); --h3:rgba(255,157,31,.6); --h4:rgba(255,176,77,.88);
  --wash:.55; --bg-filter:blur(24px) saturate(.9) brightness(.45);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.85rem;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem;font-weight:500}
.mono{font-family:var(--f-mono);font-size:.78rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:.72rem;font-family:var(--f-mono)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px}
.sync{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface)}
.search-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;color:var(--muted);width:100%}
.search-btn .kbd{margin-left:auto}

.main{overflow-y:auto;min-width:0}
.view{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-inline:28px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head p{margin:4px 0 0}
.grid{display:grid;gap:16px}
.g-today{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-h .src{margin-left:auto}
.src{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.work{background:var(--accent-soft);color:var(--accent-text)}
.chip.personal{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* alert */
.alert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px 16px}
.alert b{color:var(--warn)}
.alert .btn{margin-left:auto}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);border-radius:5px;background:none;padding:0;display:grid;place-items:center}
.check:hover{border-color:var(--accent)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.task.done .t-text{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input,.add-row select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0}
.add-row input{flex:1}
/* task groups (Hari ini) */
.task-head{flex-wrap:wrap}
.task-head .seg{margin-left:auto}
.task-head .tg-all{margin-left:auto;color:var(--muted);white-space:nowrap}
.task-head .tg-all:hover{color:var(--accent-text)}
.task-head .tg-all + .seg{margin-left:0}
.task-head .seg button{padding:3px 10px;font-size:.82rem}
.tgroups{display:flex;flex-direction:column}
.tgroup{border-top:1px solid var(--line);padding:4px 0}
.tgroup:first-child{border-top:0}
.tgroup > summary,.tdone > summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 4px;border-radius:6px;font-weight:600;font-size:.88rem;list-style:none}
.tgroup > summary::-webkit-details-marker,.tdone > summary::-webkit-details-marker{display:none}
.tgroup > summary::before,.tdone > summary::before{content:"";flex:none;width:6px;height:6px;margin:0 3px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg)}
.tgroup[open] > summary::before,.tdone[open] > summary::before{transform:rotate(45deg)}
.tgroup > summary:hover,.tdone > summary:hover{background:var(--sunk)}
.tgroup > summary .n{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-weight:500}
.tgroup .tasks,.tdone .tasks{padding-left:18px}
.tdone{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.tdone > summary{color:var(--muted);font-weight:500}
.task-empty{margin:4px 0;font-size:.86rem}

/* journal */
.jform{display:flex;flex-direction:column;gap:12px}
.jfield{display:flex;flex-direction:column;gap:5px}
.jfield > label{font-size:.78rem;font-weight:600;color:var(--muted)}
.jform input[type="text"],.jform textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font:inherit}
.jform textarea{resize:vertical;min-height:8.5em;line-height:1.5}
.jfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jfoot .hint{font-size:.76rem;color:var(--muted);margin-right:auto}
.jpanel:not(.open){padding-block:10px}
.jpanel:not(.open) .panel-h{margin-bottom:0}
.jhead h2{flex:1 1 auto;min-width:0;margin:0}
.jtoggle{display:flex;align-items:center;gap:8px;width:100%;min-width:0;border:0;background:none;color:var(--ink);padding:4px 6px;margin:-4px -6px;border-radius:8px;font:inherit;text-align:left;cursor:pointer}
.jtoggle:hover{background:var(--sunk)}
.jt-title{flex:none;font-weight:700}
.jchev{flex:none;width:16px;height:16px;color:var(--muted);transition:transform .15s}
.jtoggle[aria-expanded="true"] .jchev{transform:rotate(90deg)}
.jstat{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;font-family:var(--f-body);font-size:.8rem;font-weight:400;color:var(--muted)}
.jstat .jhl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.jstat .jmeta{flex:none;white-space:nowrap}
.jhead .src{flex:none}

/* habits */
.habits{display:flex;flex-direction:column;gap:6px}
.habit{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 0;border-radius:8px;width:100%}
.habit:hover{background:var(--sunk)}
.habit .hb-tog{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:4px 8px;border:0;background:none;text-align:left;color:inherit;border-radius:8px}
.habit .hb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.habit.done .hb{background:var(--good);border-color:var(--good)}
.habit.done .hb::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.habit.missed .hb{border-color:var(--line);background:var(--sunk)}
.habit.missed .hb::after{content:"";width:8px;height:2px;border-radius:1px;background:var(--muted)}
.habit.missed .hb-lbl{color:var(--muted)}
.habit .streak{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.habit .hb-side{display:flex;align-items:center;gap:6px;flex:none;font-size:.74rem;color:var(--muted);white-space:nowrap}
.habit .hb-txt{border:0;background:none;padding:3px 6px;border-radius:6px;font-size:.74rem;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.habit .hb-txt:hover{color:var(--ink);background:var(--surface)}
.ring-row{display:flex;align-items:center;gap:14px;margin-bottom:8px}

/* goals */
.horizon{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.horizon:first-of-type{border-top:0}
.horizon-label{display:flex;flex-direction:column;gap:2px}
.vision{font-family:var(--f-display);font-size:1.35rem;line-height:1.35;font-weight:500;max-width:62ch;text-wrap:pretty}
.goal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.goal{display:flex;flex-direction:column;gap:10px}
.goal h3{font-weight:600}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}
.goal .links{display:flex;flex-wrap:wrap;gap:6px}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat-row b{font-family:var(--f-display);font-size:1.3rem}

/* projects */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.proj{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:border-color .15s}
.proj:hover{border-color:var(--accent)}
.proj-top{display:flex;gap:8px;align-items:center}
.proj-top .status{margin-left:auto}
.status{font-size:.74rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-active{color:var(--good)} .st-paused{color:var(--warn)} .st-idea{color:var(--muted)} .st-done{color:var(--accent-text)}
.proj .next{font-size:.86rem;border-top:1px solid var(--line);padding-top:8px;display:flex;gap:6px}
.proj .next span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* arsip */
.arc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.arc-list li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.arc-list li:first-child{border-top:0}
.arc-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 260px}
.arc-title{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:.95rem;color:var(--ink)}
.arc-title:hover{color:var(--accent-text)}
.arc-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem}
.arc-meta .src{overflow-wrap:anywhere}
.chip.arc{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad);background:var(--sunk)}
.drawer-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.confirm{border:1px solid var(--bad);border-radius:var(--r);background:var(--sunk);padding:12px 14px;display:flex;flex-direction:column;gap:10px;width:100%}
.confirm p{margin:0;font-size:.88rem}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.arc-banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px dashed var(--line);background:var(--sunk);color:var(--muted);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.arc-banner .btn{margin-left:auto}
.check:disabled{cursor:not-allowed;opacity:.55}
.check:disabled:hover{border-color:var(--muted)}
.toast .btn{background:none;color:var(--bg);border-color:currentColor;padding:2px 10px;font-size:.82rem}
.toast .btn:hover{color:var(--bg);border-color:currentColor;filter:brightness(1.2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.42);display:flex;justify-content:flex-end;z-index:30}
.drawer{width:min(620px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.drawer-h{display:flex;gap:12px;align-items:flex-start}
.drawer-h .x{margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-color:var(--accent)}
.fm{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:.86rem}
.fm dt{color:var(--muted)}
.fm dd{margin:0}
.file-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.file-list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.file-list li:first-child{border-top:0}

/* kanban */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;min-width:max-content}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px;width:220px}
.lane.over{outline:2px dashed var(--accent);outline-offset:-2px}
.lane-h{display:flex;align-items:center;gap:6px;padding:2px 4px}
.lane-h b{font-size:.85rem}
.lane-h .n{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card b{font-weight:600;font-size:.9rem}
.card p{margin:0;font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lane .ghost-add{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--muted);font-size:.82rem}

/* journal page */
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.heat i{border-radius:3px;background:var(--h0)}
.heat i[data-l="1"]{background:var(--h1)} .heat i[data-l="2"]{background:var(--h2)} .heat i[data-l="3"]{background:var(--h3)} .heat i[data-l="4"]{background:var(--h4)}
.heat i.today{outline:2px solid var(--gold);outline-offset:1px}
.heat-months{display:flex;font-size:.7rem;color:var(--muted);margin-bottom:4px;font-family:var(--f-mono)}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;display:block}
.timeline{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day-date b{font-family:var(--f-display);font-size:1.05rem;display:block}
.day-body{display:flex;flex-direction:column;gap:4px}
.day-hl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.day-sum{margin:0;font-size:.88rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.day-sum.open{display:block;-webkit-line-clamp:unset;overflow:visible}
.more{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent-text);font-size:.8rem;font-weight:500}
.habit-strip{display:grid;grid-template-columns:150px repeat(14,minmax(14px,1fr));gap:4px;align-items:center;font-size:.82rem}
.habit-strip i{height:14px;border-radius:3px;background:var(--h0)}
.habit-strip i.done,.legend i.done{background:var(--good)}
.habit-strip i.missed,.legend i.missed{background:repeating-linear-gradient(135deg,var(--sunk) 0 2px,var(--muted) 2px 3px);opacity:.55}

/* watchlist */
.watch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.watch{padding:0;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:16/9;max-width:100%;display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.35);position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover.has-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 70%)}
.cover-title{position:relative;z-index:2}
.cover.drop{outline:3px dashed var(--accent);outline-offset:-3px}
.cover.drop::after{content:"Lepas buat upload";position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-family:var(--f-body);font-weight:600;font-size:.9rem;text-shadow:none}
.cover-acts{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:6px}
.cover-btn{border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.55);color:#fff;border-radius:7px;padding:4px 9px;font:500 .76rem/1.2 var(--f-body);text-shadow:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.cover-btn:hover{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.6)}
.cover-btn svg{width:13px;height:13px;flex:none}
.watch-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:8px}
.ep b{font-family:var(--f-display);font-size:1.2rem}

/* notes */
.notes{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.tree{font-size:.86rem;max-height:70vh;overflow:auto}
.tree details{margin-left:6px}
.tree summary{cursor:pointer;padding:3px 4px;border-radius:5px;color:var(--ink);font-weight:500}
.tree .f{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 4px 3px 18px;border-radius:5px;color:var(--muted)}
.tree .f:hover,.tree .f.on{background:var(--accent-soft);color:var(--accent-text)}
.tree .locked{padding:3px 4px 3px 18px;color:var(--muted);opacity:.6;font-size:.8rem}
.doc{max-width:72ch}
.doc h1{font-size:1.5rem;margin-bottom:12px}
.doc h2{margin:18px 0 8px}
.doc table{border-collapse:collapse;width:100%;font-size:.86rem;margin:8px 0}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.doc th{color:var(--muted);font-weight:600}
.doc td:last-child{font-variant-numeric:tabular-nums}
.doc blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:.88rem}
.doc .wl{color:var(--accent-text);text-decoration:underline;text-decoration-style:dotted;cursor:pointer}
.table-wrap{overflow-x:auto}

/* palette & toast */
.pal-scrim{position:fixed;inset:0;background:rgba(10,12,24,.42);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;background:none;font-size:1rem;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li button{width:100%;border:0;background:none;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;text-align:left}
.pal li button:hover,.pal li button.sel{background:var(--accent-soft)}
.pal li .k{margin-left:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:.86rem;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast .mono{opacity:.75}
.toast[hidden]{display:none}
.sample{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:1px 8px}

@media (max-width:1000px){ .g-today{grid-template-columns:minmax(0,1fr)} .notes{grid-template-columns:minmax(0,1fr)} .tree{max-height:240px} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:column;gap:10px;padding:12px 16px 8px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand{padding:0}
  .side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .nav .count{display:none}
  .view{padding-inline:16px;padding-block:18px 48px}
  h1{font-size:1.5rem}
  .horizon{grid-template-columns:minmax(0,1fr);gap:8px}
  .day{grid-template-columns:minmax(0,1fr);gap:6px}
  .habit-strip{grid-template-columns:96px repeat(14,minmax(8px,1fr));gap:3px;font-size:.74rem}
  .drawer{padding:16px}
  .jhead .src{display:none}
  .jtoggle{flex-wrap:wrap;row-gap:2px}
  .jstat{flex-basis:100%;padding-left:24px}
}

body::after{background:var(--bg);opacity:var(--wash)}
h1{font-weight:600;letter-spacing:-.01em}
h2{font-weight:800}
h3{font-weight:700}
.eyebrow{letter-spacing:.22em;font-weight:700;color:var(--muted)}
:focus-visible{outline-color:var(--navy);border-radius:10px}

/* frosted glass: everything that floats */
.side,.panel,.lane,.alert,.arc-banner,.confirm{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:0}
.side{margin:12px 0 12px 12px;border-radius:var(--r);height:calc(100% - 24px)}
.panel{border-radius:var(--r);padding:18px 22px}
.alert{background:var(--warn-soft)}
.lane{border-radius:var(--r);padding:12px}
.card{background:var(--card-glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:0;border-radius:var(--r-sm)}
.proj:hover,.panel.proj:hover{box-shadow:inset 0 0 0 2px var(--accent)}

const main = $("#main"), layer = $("#layer");
let toastT;
function toast(msg, file, action){
  clearTimeout(toastT);
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = '<span>'+esc(msg) + (file ? ' <span class="mono">→ '+esc(file)+'</span>' : "")+'</span>' + (action ? '<button class="btn sm" type="button" id="toastAct">'+esc(action.label)+'</button>' : "");
  if(action) t.querySelector("#toastAct").addEventListener("click", ev=>{ ev.stopPropagation(); clearTimeout(toastT); t.hidden = true; action.fn(); });
  t.hidden = false;
  toastT = setTimeout(()=>{ t.hidden = true; }, action ? 5200 : 2600);
}
const proj = slug => S.projects.find(p=>p.slug===slug);
const isArchived = p => !!p && p.status==="archived";
/* task dari proyek yang diarsip ga ikut tampil di Hari ini / hitungan nav */
const liveTask = t => !t.project || !isArchived(proj(t.project));
const openLiveCount = () => S.tasks.filter(t=>!t.done && liveTask(t)).length;
/* Uncategorize ga punya proyek: @work = work, sisanya personal */
const taskKind = t => { const p = t.project && proj(t.project); return p ? p.type : (t.tags.includes("work") ? "work" : "personal"); };
/* urutan file: per file, terus nomor baris */
const byFile = (a,b) => a.file===b.file ? a.line-b.line : a.file.localeCompare(b.file);
const archPath = slug => "Archive/Projects/"+slug+"/";
const arcChip = p => isArchived(p) ? '<span class="chip arc" title="Proyek diarsip">arsip</span>' : "";
function archiveProject(slug){
  const p = proj(slug); if(!p || isArchived(p)) return;
  const prev = {status:p.status, updated:p.updated};
  p.status = "archived"; p.archived = TODAY_ISO; p.updated = TODAY_ISO;
  layer.innerHTML = ""; delete layer.dataset.drawer;
  render();
  toast("Proyek diarsip", "Projects/"+slug+"/ → "+archPath(slug), {label:"Urungkan", fn:()=>{
    p.status = prev.status; p.updated = prev.updated; delete p.archived;
    render(); toast("Arsip dibatalin", archPath(slug)+" → Projects/"+slug+"/");
  }});
}
function restoreProject(slug){
  const p = proj(slug); if(!isArchived(p)) return;
  p.status = "paused"; delete p.archived; p.updated = TODAY_ISO;
  if(layer.dataset.drawer===slug && layer.querySelector(".drawer")) drawerProject(slug, layer.dataset.tab);
  render();
  toast("Proyek dipulihkan", archPath(slug)+" → Projects/"+slug+"/");
}
const projTasks = slug => S.tasks.filter(t=>t.project===slug);
const progress = slug => { const ts = projTasks(slug); return ts.length ? ts.filter(t=>t.done).length/ts.length : 0; };
function taskLi(t, opts={}){
  const p = t.project && proj(t.project);
  return '<li class="task'+(t.done?" done":"")+'"><button class="check"'+(opts.idp?' id="'+opts.idp+t.id+'"':"")+' data-act="toggle" data-id="'+t.id+'" aria-label="Tandai selesai: '+esc(t.text)+'" aria-pressed="'+t.done+'"'+(opts.readOnly?' disabled title="Proyek diarsip (read-only)"':"")+'></button>'+
    '<div><div class="t-text">'+esc(t.text)+'</div><div class="t-meta">'+
    (opts.noProject||!p ? "" : '<span class="chip '+p.type+'">'+esc(p.title)+'</span>'+arcChip(p))+
    t.tags.map(g=>'<span class="chip">@'+esc(g)+'</span>').join("")+
    '<span class="src">'+esc(t.file)+':'+t.line+'</span></div></div></li>';
}

const NAV = [["today","Hari ini"],["goals","Goals"],["projects","Proyek"],["content","Konten"],["journal","Jurnal & Habit"],["watch","Watchlist"],["notes","Catatan"]];
function renderNav(){
  const counts = {today: openLiveCount(), projects: S.projects.filter(p=>p.status==="active" && !isArchived(p)).length, content: S.content.filter(c=>c.stage!=="done").length, watch: S.watch.filter(w=>w.status==="watching").length};
  $("#nav").innerHTML = NAV.map(([k,l])=>'<button type="button" data-nav="'+k+'"'+(S.view===k?' aria-current="page"':"")+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>'+l+(counts[k]?'<span class="count">'+counts[k]+'</span>':"")+'</button>').join("");

/* ===== habit: null (belum) | "done" | "missed" (terlewat) ===== */
const habitCounts = () => ({done:S.habits.filter(h=>h.state==="done").length, missed:S.habits.filter(h=>h.state==="missed").length});
const habitStreak = h => h.state==="done" ? h.base+1 : h.state==="missed" ? 0 : h.base;
function habitRow(h){
  const st = h.state, sk = habitStreak(h);
  const side = st==="missed"
    ? '<span class="hb-side">terlewat · besok lagi<button type="button" class="hb-txt" id="hb-undo-'+h.id+'" data-act="habit-undo" data-id="'+h.id+'" aria-label="Batalin terlewat: '+esc(h.label)+'">Batal</button></span>'
    : st==="done"
      ? '<span class="streak">'+(sk?sk+" hari":"—")+'</span>'
      : '<span class="hb-side"><button type="button" class="hb-txt" id="hb-miss-'+h.id+'" data-act="habit-miss" data-id="'+h.id+'" aria-label="Tandai '+esc(h.label)+' terlewat hari ini">Terlewat</button></span>';
  return '<div class="habit'+(st?" "+st:"")+'"><button type="button" class="hb-tog" id="hb-'+h.id+'" data-act="habit" data-id="'+h.id+'" aria-pressed="'+(st==="done")+'"'+(st==="missed"?' aria-description="terlewat hari ini"':"")+'><span class="hb" aria-hidden="true"></span><span class="hb-lbl">'+esc(h.label)+'</span></button>'+side+'</div>';
}
function setHabit(id, state){
  const h = S.habits.find(x=>x.id===id); if(!h) return;
  h.state = state;
  const f = "2026-10-15.md · habits."+h.id;
  if(state==="done") toast("Habit dicentang", f+": done");
  else if(state==="missed") toast("Oke, besok lagi", f+": missed");
  else toast("Dibatalin", f);
  render();
  const el = document.getElementById(state==="missed" ? "hb-undo-"+id : "hb-"+id); if(el) el.focus();
}

/* ===== task panel: tanpa deadline, semua task terbuka dalam satu daftar ===== */
function taskPanel(){
  const f = S.taskFilter, inF = t => f==="all" || taskKind(t)===f;
  const live = S.tasks.filter(t=>liveTask(t) && inF(t));
  const open = live.filter(t=>!t.done), doneTd = live.filter(t=>t.done && t.doneAt===TODAY_ISO).sort(byFile);
  const groups = [{key:"uncat", title:"Uncategorize", chip:"", ts:open.filter(t=>!t.project)}]
    .concat(S.projects.filter(p=>!isArchived(p)).map(p=>({key:p.slug, title:p.title, chip:'<span class="chip '+p.type+'">'+p.type+'</span>', ts:open.filter(t=>t.project===p.slug)})))
    .filter(g=>g.ts.length);
  const seg = [["all","Semua"],["personal","Personal"],["work","Work"]].map(([k,l])=>'<button type="button" id="tf-'+k+'" data-tf="'+k+'" aria-pressed="'+(f===k)+'">'+l+'</button>').join("");
  const grp = g => '<details class="tgroup" data-tg="'+g.key+'"'+(S.taskClosed[g.key]?"":" open")+'><summary id="tgs-'+g.key+'" aria-label="'+esc(g.title)+', '+g.ts.length+' terbuka">'+esc(g.title)+g.chip+'<span class="n">'+g.ts.length+'</span></summary>'+
    '<ul class="tasks">'+g.ts.slice().sort(byFile).map(t=>taskLi(t,{noProject:true, idp:"tk-"})).join("")+'</ul></details>';
  const allBtn = groups.length>1 ? tgAllBtn(groups.some(g=>!S.taskClosed[g.key])) : "";
  return '<section class="panel" aria-labelledby="tp-h"><div class="panel-h task-head"><h2 id="tp-h">Quest</h2><span class="muted tnum" style="font-size:.82rem">'+open.length+' terbuka</span>'+allBtn+'<div class="seg" role="group" aria-label="Filter quest">'+seg+'</div></div>'+
    (groups.length ? '<div class="tgroups">'+groups.map(grp).join("")+'</div>'
                   : '<p class="muted task-empty">Ga ada quest terbuka'+(f==="all"?"":" di filter ini")+'. Mantap.</p>')+
    '<form class="add-row" id="tform"><input id="ttext" aria-label="Quest baru" placeholder="Quest baru… (@tag boleh)" autocomplete="off"><select id="tproj" aria-label="Simpan ke"><option value="">Uncategorize</option>'+S.projects.filter(p=>p.status!=="done" && !isArchived(p)).map(p=>'<option value="'+p.slug+'">'+esc(p.title)+'</option>').join("")+'</select><button class="btn" type="submit">Tambah</button></form>'+
    '<details class="tdone" id="tdone"'+(S.doneOpen?" open":"")+'><summary id="tdone-sum">Selesai hari ini ('+doneTd.length+')</summary>'+
      (doneTd.length ? '<ul class="tasks">'+doneTd.map(t=>taskLi(t,{idp:"tk-"})).join("")+'</ul>' : '<p class="muted task-empty">Belum ada yang dicentang hari ini.</p>')+
    '</details></section>';
}
/* tombol tutup/buka semua grup quest (yang keliatan di filter aktif) */
const IC_COLLAPSE = '<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>', IC_EXPAND = '<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>';
function tgAllInner(anyOpen){
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(anyOpen?IC_COLLAPSE:IC_EXPAND)+'</svg>'+(anyOpen?"Tutup semua":"Buka semua");
}
function tgAllBtn(anyOpen){
  return '<button class="btn sm tg-all" type="button" id="tg-all" data-act="tg-all" aria-label="'+(anyOpen?"Tutup semua":"Buka semua")+'">'+tgAllInner(anyOpen)+'</button>';
}
function syncTgAll(){
  const b=document.getElementById("tg-all"); if(!b) return;
  const anyOpen=[...document.querySelectorAll(".tgroups .tgroup")].some(g=>g.open);
  const lbl=anyOpen?"Tutup semua":"Buka semua";
  if(b.getAttribute("aria-label")!==lbl){ b.setAttribute("aria-label",lbl); b.innerHTML=tgAllInner(anyOpen); }
}
/* habis centang/uncentang: fokus ke task berikutnya di grup yang sama, kalau ga ada ke ringkasan grup */
function focusPlan(el, t){
  if(el.closest(".drawer")) return ["dtk-"+t.id];
  if(!t.done) return ["tk-"+t.id, "tgs-"+(t.project||"uncat"), "tdone-sum"];
  const g = el.closest(".tgroup"); if(!g) return ["tk-"+t.id, "tdone-sum"];
  const cs = [...g.querySelectorAll(".check")], i = cs.indexOf(el), ids = [];
  if(cs[i+1]) ids.push(cs[i+1].id);
  if(cs[i-1]) ids.push(cs[i-1].id);
  ids.push("tgs-"+g.dataset.tg);
  [g.nextElementSibling, g.previousElementSibling].forEach(s=>{ if(s && s.matches(".tgroup")) ids.push("tgs-"+s.dataset.tg); });
  ids.push("tdone-sum");
  return ids;
}
function focusFirst(ids){
  for(const id of ids){ const x = id && document.getElementById(id); if(x && x.getClientRects().length){ x.focus(); return; } }
}

function jstat(){

  return (j.highlight ? '<span class="jhl">'+esc(j.highlight)+'</span><span class="jmeta" aria-hidden="true">·</span>' : "")+
    '<span class="jmeta">'+wordCount(j.summary)+' kata · '+(j.savedAt?"disimpan "+j.savedAt:"belum disimpan")+'</span>';
}
function setJournalOpen(open){
  S.journalOpen = open;
  const b=$("#jtoggle"), body=$("#jbody"); if(!b||!body) return;
  b.setAttribute("aria-expanded", String(open)); body.hidden = !open;
  b.closest(".jpanel").classList.toggle("open", open);
}

function vToday(){
  const d = TODAY;
  const hc = habitCounts(), habitsTot = S.habits.length, habitsOpen = habitsTot-hc.done-hc.missed;
  const watching = S.watch.filter(w=>w.status==="watching").slice(0,2);
  const jd = S.jdraft || {hl:S.journal.highlight, sum:S.journal.summary};
  /* ring: done (hijau) + terlewat (abu) = resolved; penuh kalau semua habit udah ditutup */
  const ring = (done,missed,tot)=>{ const r=22,c=2*Math.PI*r,dl=c*done/tot,ml=c*missed/tot;
    return '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--sunk)" stroke-width="6"/>'+
      (missed?'<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--muted)" stroke-opacity=".4" stroke-width="6" stroke-dasharray="'+ml+' '+c+'" stroke-dashoffset="'+(-dl)+'" transform="rotate(-90 28 28)"/>':"")+
      (done?'<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--good)" stroke-width="6" stroke-dasharray="'+dl+' '+c+'" transform="rotate(-90 28 28)"/>':"")+
      '<text x="28" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="var(--f-display)">'+done+'/'+tot+'</text></svg>'; };
  return '<div class="head"><div><div class="eyebrow">'+HARI[d.getDay()]+', '+d.getDate()+' '+["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][d.getMonth()]+' 2026</div><h1>Pagi, Satria.</h1><p class="muted">Highlight hari ini: <b style="color:var(--ink)">'+(S.journal.highlight?esc(S.journal.highlight):"belum diisi")+'</b></p></div><span class="sample">contoh data dari vault</span></div>'+
  '<div class="alert" role="note"><div><b>Jurnal bolong 93 hari.</b> Terakhir nulis 13 Juli, terus lanjut lagi hari ini.</div><button class="btn sm" data-nav="journal" type="button">Lihat heatmap</button></div>'+
  '<div class="grid g-today"><div class="col">'+
    '<section class="panel jpanel'+(S.journalOpen?" open":"")+'"><div class="panel-h jhead"><h2><button type="button" class="jtoggle" id="jtoggle" data-act="jtoggle" aria-expanded="'+S.journalOpen+'" aria-controls="jbody">'+
        '<svg class="jchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'+
        '<span class="jt-title">Jurnal hari ini</span><span class="jstat" id="jstat">'+jstat()+'</span></button></h2><span class="src">Journal/2026/10/2026-10-15.md</span></div>'+
      '<div id="jbody"'+(S.journalOpen?"":" hidden")+'>'+
      '<form class="jform" id="jform">'+
        '<div class="jfield"><label for="jhl">Highlight</label><input type="text" id="jhl" value="'+esc(jd.hl)+'" placeholder="Satu hal paling penting hari ini" autocomplete="off"></div>'+
        '<div class="jfield"><label for="jsum">Ringkasan hari ini</label><textarea id="jsum" rows="6" placeholder="Hari ini ngapain aja? Bebas, 1–3 paragraf atau beberapa bullet.">'+esc(jd.sum)+'</textarea></div>'+
        '<div class="jfoot"><span class="hint" id="jhint" aria-live="polite">'+wordCount(jd.sum)+' kata · '+(S.jdraft?"belum disimpan":S.journal.savedAt?"terakhir disimpan "+S.journal.savedAt:"belum disimpan")+'</span><button class="btn primary" id="jsave" type="submit">Simpan</button></div>'+
      '</form>'+
      '</div></section>'+
    taskPanel()+
  '</div><div class="col">'+
    '<section class="panel"><div class="panel-h"><h2>Habit</h2><span class="src">frontmatter: habits</span></div><div class="ring-row">'+ring(hc.done,hc.missed,habitsTot)+'<div class="muted" style="font-size:.86rem" aria-live="polite">'+(habitsOpen===0?"Hari ini beres."+(hc.missed?" "+hc.missed+" terlewat, besok lagi.":""):habitsOpen+" lagi buat hari ini"+(hc.missed?" · "+hc.missed+" terlewat":""))+'</div></div><div class="habits">'+
      S.habits.map(habitRow).join("")+'</div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Proyek aktif</h2><button class="btn sm" data-nav="projects" type="button" style="margin-left:auto">Semua</button></div>'+
      S.projects.filter(p=>p.status==="active" && !isArchived(p)).slice(0,5).map(p=>{const pr=progress(p.slug);return '<div style="display:flex;flex-direction:column;gap:4px;padding:7px 0"><div class="stat-row"><button class="btn sm" style="border:0;padding:0;background:none;font-weight:600" data-proj="'+p.slug+'" type="button">'+esc(p.title)+'</button><span class="mono muted">'+Math.round(pr*100)+'%</span></div><div class="bar'+(p.type==="personal"?" good":"")+'"><i style="width:'+(pr*100)+'%"></i></div></div>';}).join("")+'</section>'+

function vProjects(){
  const f = S.projFilter;
  const arch = S.projects.filter(isArchived);
  const list = S.projects.filter(p=> !isArchived(p) && (f==="all" || p.type===f));
  const seg = [["all","Semua"],["personal","Personal"],["work","Work"],["archived","Arsip ("+arch.length+")"]].map(([k,l])=>'<button type="button" data-pf="'+k+'" aria-pressed="'+(f===k)+'">'+l+'</button>').join("");
  const head = '<div class="head"><div><div class="eyebrow">'+(f==="archived"?"Archive/Projects/":"Projects/")+'</div><h1>'+(f==="archived"?"Proyek diarsip":"Proyek")+'</h1></div><div class="toolbar"><div class="seg" role="group" aria-label="Filter proyek">'+seg+'</div><button class="btn" type="button" data-act="toast" data-msg="Proyek baru dibuat" data-file="Projects/proyek-baru/README.md">+ Proyek</button></div></div>';

function vJournal(){
  const start = new Date(TODAY); start.setDate(start.getDate()-7*26+1);
  while(start.getDay()!==1) start.setDate(start.getDate()-1);
  let cells="", months="", lastM=-1, col=0, cur=new Date(start), total=0;
  const weeks=[];
  while(cur<=TODAY){ const dow=(cur.getDay()+6)%7; if(dow===0){ weeks.push(cur.getMonth()); }
    const k=iso(cur), l=JOURNAL_DATES[k]||0; if(l) total++;
    cells+='<i data-l="'+l+'" title="'+k+(l?" · jurnal ada":" · kosong")+'"'+(k===TODAY_ISO?' class="today"':"")+'></i>'; cur.setDate(cur.getDate()+1); }
  weeks.forEach((m,i)=>{ months+='<span style="width:16px;flex:none">'+(m!==lastM?BULAN[m]:"")+'</span>'; lastM=m; });
  const hcJ = habitCounts();
  const strip = S.habits.map(h=>{ let s='<span>'+esc(h.label.split(" ").slice(0,3).join(" "))+'</span>'; for(let i=13;i>=0;i--){ const st = i===0 ? h.state : (i<4 ? ((h.id.length*7+i*3)%5<2 ? "done" : (h.id.length+i)%4===0 ? "missed" : null) : null); s+='<i class="'+(st||"")+'" title="'+(i===0?"hari ini":i+" hari lalu")+' · '+(st==="done"?"selesai":st==="missed"?"terlewat":"kosong")+'"></i>'; } return s; }).join("");
  return '<div class="head"><div><div class="eyebrow">Journal/</div><h1>Jurnal & Habit</h1></div><span class="sample">heatmap = tanggal jurnal asli di vault</span></div>'+
  '<div class="kpis"><div class="panel kpi"><span class="eyebrow">Hari dijurnal</span><b class="tnum">'+total+'</b><span class="muted" style="font-size:.82rem">26 minggu terakhir</span></div><div class="panel kpi"><span class="eyebrow">Streak sekarang</span><b class="tnum">1</b><span class="muted" style="font-size:.82rem">rekor: 7 hari (7–13 Jul)</span></div><div class="panel kpi"><span class="eyebrow">Bolong terpanjang</span><b class="tnum" style="color:var(--warn)">93</b><span class="muted" style="font-size:.82rem">14 Jul – 14 Okt</span></div><div class="panel kpi"><span class="eyebrow">Habit hari ini</span><b class="tnum">'+hcJ.done+'/'+S.habits.length+'</b><span class="muted" style="font-size:.82rem">'+(hcJ.missed?hcJ.missed+" terlewat · ":"")+'dari Habits.md</span></div></div>'+
  '<section class="panel"><div class="panel-h"><h2>Heatmap jurnal</h2></div><div class="heat-wrap"><div class="heat-months">'+months+'</div><div class="heat">'+cells+'</div></div><div class="legend">kosong <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> ringkasan panjang</div><p class="muted" style="margin:4px 0 0;font-size:.74rem">Warna = panjang ringkasan hari itu (pendek → panjang).</p></section>'+
  '<section class="panel"><div class="panel-h"><h2>Habit 14 hari</h2><span class="sample">contoh</span></div><div style="overflow-x:auto"><div class="habit-strip">'+strip+'</div></div><div class="legend" style="flex-wrap:wrap"><i class="done"></i> selesai <i class="missed" style="margin-left:8px"></i> terlewat <i style="background:var(--h0);margin-left:8px"></i> kosong <span class="src" style="margin-left:auto">habits: { '+esc(S.habits.filter(h=>h.state).map(h=>h.id+": "+h.state).join(", "))+' }</span></div></section>'+
  '<section class="panel"><div class="panel-h"><h2>Timeline</h2><div class="seg" style="margin-left:auto" role="group" aria-label="Filter tag"><button type="button" aria-pressed="true">Semua</button><button type="button" aria-pressed="false">@work</button><button type="button" aria-pressed="false">@konten</button></div></div><div class="timeline">'+

/* cover watchlist: app asli nyimpen ke Watchlist/_covers/<slug>.webp (re-encode, maks 800px) + frontmatter cover:. Di mockup cuma di memori. */
const COVER_MAX = 5*1024*1024;
const IC_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>';
/* posisi cover: frontmatter cover_pos: "x y zoom" (persen, persen, kali). Default tengah, 1×. */
const IC_MOVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>';
const coverPos = w => (S.coverEdit && S.coverEdit.slug===w.slug) ? S.coverEdit : (w.coverPos || {x:50, y:50, z:1});
const posStyle = c => "--cx:"+c.x.toFixed(1)+"%;--cy:"+c.y.toFixed(1)+"%;--cz:"+c.z.toFixed(2);
function coverHtml(w){
  const t=esc(w.title), has=!!w.cover, ed=has && S.coverEdit && S.coverEdit.slug===w.slug, c=coverPos(w);
  if(ed) return '<div class="cover has-img adjusting" id="cover-'+w.slug+'" data-cover="'+w.slug+'" data-adjust="'+w.slug+'" tabindex="0" role="group" aria-label="Atur posisi cover '+t+'. Geser gambar, atau pakai panah. Enter simpan, Esc batal." style="'+posStyle(c)+'">'+
    '<img src="'+esc(w.cover)+'" alt="" draggable="false">'+
    '<span class="cover-hint">Geser gambar</span>'+
    '<div class="cover-acts">'+
      '<button class="cover-btn" type="button" id="cover-adj-no-'+w.slug+'" data-act="cover-adj-no" data-id="'+w.slug+'">Batal</button>'+
      '<button class="cover-btn ok" type="button" id="cover-adj-ok-'+w.slug+'" data-act="cover-adj-ok" data-id="'+w.slug+'">Simpan</button></div>'+
    '<div class="cover-adjust"><label for="cover-zoom-'+w.slug+'">Zoom</label><input type="range" id="cover-zoom-'+w.slug+'" data-cover-zoom="'+w.slug+'" min="1" max="3" step="0.05" value="'+c.z+'">'+
      '<button class="cover-btn" type="button" data-act="cover-adj-reset" data-id="'+w.slug+'">Reset</button></div>'+
  '</div>';
  return '<div class="cover'+(has?" has-img":"")+'" id="cover-'+w.slug+'" data-cover="'+w.slug+'"'+(has?' style="'+posStyle(c)+'"':' style="background:linear-gradient(135deg,'+w.c1+','+w.c2+')"')+'>'+
    (has?'<img src="'+esc(w.cover)+'" alt="">':"")+
    '<span class="cover-title">'+t+'</span>'+
    '<div class="cover-acts">'+
      (has
        ? '<button class="cover-btn" type="button" id="cover-adj-'+w.slug+'" data-act="cover-adj" data-id="'+w.slug+'" aria-label="Atur posisi cover '+t+'">'+IC_MOVE+'Atur</button>'+
          '<button class="cover-btn" type="button" id="cover-up-'+w.slug+'" data-act="cover-pick" data-id="'+w.slug+'" aria-label="Ganti cover '+t+'">'+IC_UP+'Ganti</button>'+
          '<button class="cover-btn" type="button" id="cover-del-'+w.slug+'" data-act="cover-del" data-id="'+w.slug+'" aria-label="Hapus cover '+t+'">Hapus</button>'
        : '<button class="cover-btn" type="button" id="cover-up-'+w.slug+'" data-act="cover-pick" data-id="'+w.slug+'" aria-label="Upload cover '+t+'">'+IC_UP+'Upload cover</button>')+
    '</div>'+
    '<input type="file" accept="image/*" hidden id="cover-in-'+w.slug+'" data-cover-in="'+w.slug+'" aria-label="Upload cover '+t+'">'+
  '</div>';
}
function setCover(slug, file){
  const w=S.watch.find(x=>x.slug===slug); if(!w||!file) return;
  if(!/^image\//.test(file.type||"") || file.size>COVER_MAX){ toast("File harus gambar, maks 5 MB"); return; }
  const r=new FileReader();
  r.onload=()=>{ w.cover=r.result; delete w.coverPos; if(S.coverEdit&&S.coverEdit.slug===slug) S.coverEdit=null; w.updated=TODAY_ISO; toast("Cover disimpan","Watchlist/_covers/"+slug+".webp · cover"); render(); focusFirst(["cover-up-"+slug]); };
  r.onerror=()=>toast("Gagal baca file");
  r.readAsDataURL(file);
}

/* object-position + scale (origin di titik yang sama) → tepi kiri gambar = -x·(z·lebarGambar − lebarKotak). Jadi geser 1px = 100/overflow persen. */
function coverOverflow(c){
  const img=c.querySelector("img"), bw=c.clientWidth, bh=c.clientHeight, nw=img.naturalWidth||bw, nh=img.naturalHeight||bh;
  const s=Math.max(bw/nw, bh/nh), z=S.coverEdit.z;
  return {ox:nw*s*z-bw, oy:nh*s*z-bh};
}
function clampCover(){ const c=S.coverEdit; c.x=Math.min(100,Math.max(0,c.x)); c.y=Math.min(100,Math.max(0,c.y)); c.z=Math.min(3,Math.max(1,c.z)); }
function applyCoverEdit(){ const el=document.getElementById("cover-"+S.coverEdit.slug); if(el) el.style.cssText=posStyle(S.coverEdit); }
function saveCoverPos(){ const c=S.coverEdit; if(!c) return; const w=S.watch.find(x=>x.slug===c.slug); S.coverEdit=null;
  if(w){ w.coverPos={x:c.x, y:c.y, z:c.z}; w.updated=TODAY_ISO; toast("Posisi cover disimpan","Watchlist/"+w.slug+".md · cover_pos: "+Math.round(c.x)+" "+Math.round(c.y)+" "+c.z.toFixed(2)); }
  render(); if(w) focusFirst(["cover-adj-"+w.slug]); }
function cancelCoverPos(){ const c=S.coverEdit; S.coverEdit=null; render(); if(c) focusFirst(["cover-adj-"+c.slug]); }

const VIEWS = {today:vToday, goals:vGoals, projects:vProjects, content:vContent, journal:vJournal, watch:vWatch, notes:vNotes};
function render(){ renderNav(); main.innerHTML = '<div class="view">'+VIEWS[S.view]()+'</div>'; bindDnD(); }

/* ===== events ===== */
document.addEventListener("click", e=>{
  const el = e.target.closest("button,[data-proj],[data-close]"); if(!el) return;
  const d = el.dataset;
  if(d.nav){ layer.innerHTML=""; go(d.nav); return; }
  if(d.close && e.target===el){ layer.innerHTML=""; delete layer.dataset.drawer; return; }
  if(d.proj){ drawerProject(d.proj); return; }
  if(d.ptab){ drawerProject(d.slug,d.ptab); return; }
  if(d.pf){ S.projFilter=d.pf; render(); return; }
  if(d.wf){ S.watchFilter=d.wf; render(); return; }
  if(d.openNote!==undefined){ layer.innerHTML=""; go("notes"); return; }
  if(d.tf){ S.taskFilter=d.tf; render(); focusFirst(["tf-"+d.tf]); return; }
  if(d.act==="toggle"){ const t=S.tasks.find(x=>x.id==d.id); if(!t) return;
    t.done=!t.done; if(t.done) t.doneAt=TODAY_ISO; else delete t.doneAt;
    const fx=focusPlan(el, t);
    toast(t.done?"Quest selesai":"Quest dibuka lagi", t.file+":"+t.line+(t.done?"  [x] done:"+TODAY_ISO:"  [ ]")); refresh(); focusFirst(fx); return; }
  if(d.act==="tg-all"){ const gs=[...document.querySelectorAll(".tgroups .tgroup")], close=gs.some(g=>g.open);
    gs.forEach(g=>{ S.taskClosed[g.dataset.tg]=close; }); render(); focusFirst(["tg-all"]); return; }
  if(d.act==="habit"){ const h=S.habits.find(x=>x.id===d.id); setHabit(d.id, h.state==="done"?null:"done"); return; }
  if(d.act==="habit-miss"){ setHabit(d.id, "missed"); return; }
  if(d.act==="habit-undo"){ setHabit(d.id, null); return; }
  if(d.act==="ep"){ const w=S.watch.find(x=>x.slug===d.id); w.progress++; w.updated=TODAY_ISO; if(w.status==="plan") w.status="watching"; toast(w.title+" → ep "+w.progress,"Watchlist/"+w.slug+".md · progress"); render(); return; }
  if(d.act==="cover-pick"){ const inp=document.getElementById("cover-in-"+d.id); if(inp){ inp.value=""; inp.click(); } return; }
  if(d.act==="cover-adj"){ const w=S.watch.find(x=>x.slug===d.id); if(!w||!w.cover) return; S.coverEdit=Object.assign({slug:w.slug}, w.coverPos||{x:50,y:50,z:1}); render(); focusFirst(["cover-"+w.slug]); return; }
  if(d.act==="cover-adj-ok"){ saveCoverPos(); return; }
  if(d.act==="cover-adj-no"){ cancelCoverPos(); return; }
  if(d.act==="cover-adj-reset"){ if(!S.coverEdit) return; Object.assign(S.coverEdit,{x:50,y:50,z:1}); applyCoverEdit(); const r=document.getElementById("cover-zoom-"+S.coverEdit.slug); if(r) r.value=1; return; }
  if(d.act==="cover-del"){ const w=S.watch.find(x=>x.slug===d.id); if(!w) return; delete w.cover; delete w.coverPos; if(S.coverEdit&&S.coverEdit.slug===w.slug) S.coverEdit=null; w.updated=TODAY_ISO; toast("Cover dihapus","Watchlist/"+w.slug+".md · cover"); render(); focusFirst(["cover-up-"+w.slug]); return; }
  if(d.act==="idea"){ const n=S.content.filter(c=>c.slug.startsWith("ide-baru")).length+1; S.content.unshift({slug:"ide-baru-"+n,title:"Ide baru "+n,stage:"idea",project:null,snip:"Tulis ide 1 kalimat. Kenapa orang mau nonton sampe habis?"}); toast("Ide dibuat","Content/ide-baru-"+n+".md"); render(); return; }
  if(d.act==="archive-ask"){ const box=$("#darcbox"); if(!box) return; box.hidden=false; el.setAttribute("aria-expanded","true"); $("#darcyes").focus(); return; }
  if(d.act==="archive-no"){ const box=$("#darcbox"); if(box) box.hidden=true; const b=$("#darchive"); if(b){ b.setAttribute("aria-expanded","false"); b.focus(); } return; }
  if(d.act==="archive-yes"){ archiveProject(d.slug); return; }
  if(d.act==="restore"){ restoreProject(d.slug); return; }
  if(d.act==="toast"){ toast(d.msg, d.file); return; }
  if(d.act==="jtoggle"){ setJournalOpen(!S.journalOpen); return; }
  if(d.act==="more"){ const p=document.getElementById("dsum-"+d.d), open=!p.classList.contains("open"); p.classList.toggle("open",open); el.setAttribute("aria-expanded",String(open)); el.textContent=open?"Tutup":"Baca selengkapnya"; return; }
});
function refresh(){ if(layer.dataset.drawer && layer.querySelector(".drawer")) drawerProject(layer.dataset.drawer, layer.dataset.tab); render(); }
document.addEventListener("change", e=>{
  if(e.target.id==="pstatus"){ const p=proj(e.target.dataset.slug); p.status=e.target.value; p.updated=TODAY_ISO; toast("Status → "+p.status,"Projects/"+p.slug+"/README.md · status"); render(); }
  if(e.target.dataset && e.target.dataset.coverIn){ const f=e.target.files&&e.target.files[0]; if(f) setCover(e.target.dataset.coverIn, f); }
});
/* inget grup mana yang di-collapse (toggle ga bubble → capture) */
document.addEventListener("toggle", e=>{
  const el=e.target; if(!el.dataset) return;
  if(el.dataset.tg){ S.taskClosed[el.dataset.tg]=!el.open; syncTgAll(); }
  if(el.id==="tdone") S.doneOpen=el.open;
}, true);
document.addEventListener("input", e=>{
  if(e.target.dataset && e.target.dataset.coverZoom && S.coverEdit){ S.coverEdit.z=+e.target.value; clampCover(); applyCoverEdit(); return; }
  if(e.target.id==="jsum"||e.target.id==="jhl"){ S.jdraft={hl:$("#jhl").value, sum:$("#jsum").value}; const h=$("#jhint"); if(h) h.textContent=wordCount(S.jdraft.sum)+" kata · belum disimpan"; }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="jform"){ const now=new Date(); S.journal.highlight=$("#jhl").value.trim(); S.journal.summary=$("#jsum").value.trim(); S.journal.savedAt=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"); S.jdraft=null; toast("Jurnal disimpan","2026-10-15.md · ringkasan"); render(); $("#jsave").focus(); }
  if(e.target.id==="tform"||e.target.id==="ptform"){
    const inp = e.target.querySelector("input"), raw=inp.value.trim(); if(!raw) return;
    const slug = e.target.id==="ptform" ? e.target.dataset.slug : $("#tproj").value || null;
    const tags=(raw.match(/@[\w-]+/g)||[]).map(x=>x.slice(1));
    const text=raw.replace(/@[\w-]+/g,"").replace(/\s+/g," ").trim() || raw;
    const file = slug ? "Projects/"+slug+"/README.md" : "Uncategorize.md";
    const line = Math.max(0,...S.tasks.filter(t=>t.file===file).map(t=>t.line))+1;
    const inpId = inp.id;
    if(slug) delete S.taskClosed[slug]; else delete S.taskClosed.uncat; /* grup tujuan dibuka biar task barunya keliatan */
    S.tasks.push({id:Date.now(), text, done:false, tags, project:slug, file, line});
    toast("Quest ditambah", file+":"+line); refresh(); focusFirst([inpId]);
  }
});
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); palette(); return; }
  if(S.coverEdit && e.target.dataset && e.target.dataset.adjust){
    const step=e.shiftKey?10:2, k=e.key;
    if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"){ e.preventDefault();
      if(k==="ArrowLeft") S.coverEdit.x+=step; if(k==="ArrowRight") S.coverEdit.x-=step; if(k==="ArrowUp") S.coverEdit.y+=step; if(k==="ArrowDown") S.coverEdit.y-=step;
      clampCover(); applyCoverEdit(); return; }
    if(k==="Enter"){ e.preventDefault(); saveCoverPos(); return; }
  }
  if(e.key==="Escape" && S.coverEdit && !layer.innerHTML){ cancelCoverPos(); return; }
  if(e.key==="Escape"){ if(layer.innerHTML){ if(layer.querySelector(".drawer")) delete layer.dataset.drawer; layer.innerHTML=""; } return; }
  if(e.key==="Enter" && e.target.matches && e.target.matches(".proj")) drawerProject(e.target.dataset.proj);
});
$("#openPal").addEventListener("click", palette);
/* menu samping bisa ditutup; diinget per browser */
const appEl=$(".app"), sideToggle=$("#sideToggle"), sideOpen=$("#sideOpen");
const narrow=()=>matchMedia("(max-width:760px)").matches;
function setSide(open, focus){
  appEl.classList.toggle("side-closed", !open);
  sideToggle.setAttribute("aria-expanded", String(open));
  sideToggle.setAttribute("aria-label", open?"Tutup menu":"Buka menu"); sideToggle.title = open?"Tutup menu":"Buka menu";
  try{ localStorage.setItem("ld-side", open?"open":"closed"); }catch(e){}
  if(focus) (open || narrow() ? sideToggle : sideOpen).focus();
}
sideToggle.addEventListener("click", ()=>setSide(appEl.classList.contains("side-closed"), true));
sideOpen.addEventListener("click", ()=>setSide(true, true));
/* restore without animating, then switch motion on */
appEl.classList.add("side-instant");
try{ if(localStorage.getItem("ld-side")==="closed") setSide(false); }catch(e){}
void appEl.offsetWidth; /* apply the restored state, then allow motion */
setTimeout(()=>appEl.classList.remove("side-instant"), 0);
$("#themeBtn").addEventListener("click", ()=>{ const r=document.documentElement, dark = r.dataset.theme==="dark"; r.dataset.theme = dark?"light":"dark"; });

function palette(){
  const items = [].concat(
    [["+ Catat jurnal",()=>{S.journalOpen=true;go("today");setTimeout(()=>{setJournalOpen(true);$("#jsum")&&$("#jsum").focus();},0);},"aksi"],["+ Quest ke Uncategorize",()=>{go("today");setTimeout(()=>$("#ttext")&&$("#ttext").focus(),0);},"aksi"],["+ Ide konten",()=>{go("content");},"aksi"]],
    NAV.map(([k,l])=>[l,()=>go(k),"halaman"]),
    S.projects.filter(p=>!isArchived(p)).map(p=>[p.title,()=>drawerProject(p.slug),"proyek"]),
    S.projects.filter(isArchived).map(p=>[p.title,()=>drawerProject(p.slug),"arsip"]),
    S.watch.map(w=>[w.title,()=>go("watch"),"watchlist"]));
  layer.innerHTML='<div class="pal-scrim" data-close="1"><div class="pal" role="dialog" aria-modal="true" aria-label="Cari"><input id="palq" placeholder="Ketik nama proyek, halaman, atau aksi…" autocomplete="off"><ul id="pall"></ul></div></div>';
  const q=$("#palq"), ul=$("#pall"); let sel=0, shown=[];
  const draw=()=>{ const s=q.value.toLowerCase(); shown=items.filter(x=>x[0].toLowerCase().includes(s)).slice(0,9); sel=Math.min(sel,shown.length-1);
    ul.innerHTML=shown.map((x,i)=>'<li><button type="button" data-pi="'+i+'" class="'+(i===sel?"sel":"")+'">'+esc(x[0])+'<span class="chip k">'+x[2]+'</span></button></li>').join("")||'<li class="muted" style="padding:10px">Ga ketemu</li>'; };
  const run=i=>{ const x=shown[i]; if(!x) return; layer.innerHTML=""; x[1](); };
  q.addEventListener("input",()=>{sel=0;draw();});
  q.addEventListener("keydown",ev=>{ if(ev.key==="ArrowDown"){sel=Math.min(sel+1,shown.length-1);draw();ev.preventDefault();} if(ev.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();ev.preventDefault();} if(ev.key==="Enter"){run(sel);} });
  ul.addEventListener("click",ev=>{ const b=ev.target.closest("[data-pi]"); if(b){ ev.stopPropagation(); run(+b.dataset.pi); } });
  draw(); q.focus();
}

function bindDnD(){
  let dragSlug=null;
  main.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",ev=>{ dragSlug=c.dataset.card; c.classList.add("dragging"); ev.dataTransfer.effectAllowed="move"; try{ev.dataTransfer.setData("text/plain",dragSlug);}catch(_){} });
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  });
  main.querySelectorAll(".lane").forEach(l=>{
    l.addEventListener("dragover",ev=>{ev.preventDefault();l.classList.add("over");});
    l.addEventListener("dragleave",()=>l.classList.remove("over"));
    l.addEventListener("drop",ev=>{ ev.preventDefault(); l.classList.remove("over"); const c=S.content.find(x=>x.slug===dragSlug); if(!c||c.stage===l.dataset.lane) return; c.stage=l.dataset.lane; toast("Pindah ke "+STAGES.find(s=>s[0]===c.stage)[1],"Content/"+c.slug+".md · stage: "+c.stage); render(); });
  });
  /* geser cover yang lagi diatur */
  main.querySelectorAll(".cover[data-adjust]").forEach(c=>{
    let start=null;
    c.addEventListener("pointerdown",ev=>{ if(ev.target.closest(".cover-adjust,.cover-acts")||ev.button>0) return; ev.preventDefault(); c.focus({preventScroll:true});
      start={px:ev.clientX, py:ev.clientY, x:S.coverEdit.x, y:S.coverEdit.y, ...coverOverflow(c)}; c.setPointerCapture(ev.pointerId); c.classList.add("grabbing"); });
    c.addEventListener("pointermove",ev=>{ if(!start) return;
      if(start.ox>0) S.coverEdit.x=start.x-(ev.clientX-start.px)/start.ox*100;
      if(start.oy>0) S.coverEdit.y=start.y-(ev.clientY-start.py)/start.oy*100;
      clampCover(); applyCoverEdit(); });
    const end=()=>{ start=null; c.classList.remove("grabbing"); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
  });
  /* drop gambar ke cover watchlist */
  const hasFiles = ev => ev.dataTransfer && Array.from(ev.dataTransfer.types||[]).includes("Files");
  main.querySelectorAll(".cover[data-cover]").forEach(c=>{
    c.addEventListener("dragover",ev=>{ if(!hasFiles(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect="copy"; c.classList.add("drop"); });
    c.addEventListener("dragleave",ev=>{ if(!c.contains(ev.relatedTarget)) c.classList.remove("drop"); });
    c.addEventListener("drop",ev=>{ if(!hasFiles(ev)) return; ev.preventDefault(); c.classList.remove("drop"); const f=ev.dataTransfer.files[0]; if(f) setCover(c.dataset.cover, f); });
  });
}

try{ const v=localStorage.getItem("ld-view"); if(v && VIEWS[v]) S.view=v; }catch(e){}
render();
})();
</script>
